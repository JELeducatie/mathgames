    <div class="lvrow"><b>Niveau van deze klas</b><div class="seg">${LEVELS.map(l => `<button class="${(c.level || 1) === l.id ? 'on' : ''}" data-act="clsLevel" data-arg="${l.id}">${l.name}<small>${l.sub}</small></button>`).join('')}</div></div>
    <div class="row"><button class="btn primary" data-act="importPdf">📄 Fotolijst uit Magister (PDF)</button><button class="btn" data-act="addPhotos">📷 Losse foto's</button><button class="btn" data-act="addNoPhoto">+ Zonder foto</button>
      <div class="spacer"></div><button class="btn danger" data-act="clearScores">Scores en resultaten wissen</button></div>
    ${avMode() === 'karakter' ? `<div class="row" style="margin-top:0"><button class="btn" data-act="avResetAll">↺ Iedereen opnieuw een karakter laten kiezen</button>${c.students.some(x => x.photo) ? `<button class="btn danger" data-act="delPhotos">🗑 Echte foto's van deze klas wissen</button>` : ''}</div>` : ''}
    <p class="muted small">Met het niveau op <b>Klasniveau</b> (bij de spelopties) krijgen leerlingen van deze klas automatisch sommen op dit niveau. Fotolijst: kies de PDF die je uit Magister hebt gedownload; je controleert daarna de namen. Losse foto's: de bestandsnaam wordt de naam (Emma.jpg → Emma). ${avMode() === 'karakter' ? 'Tik op een karakter voor een ander karakter' : 'Tik op een foto om hem te vervangen'}, tik op een naam om hem aan te passen.</p>
    <div class="stgrid">${c.students.slice().sort(byName).map(st => `<div class="stedit">
        <button data-act="${avMode() === 'karakter' ? 'avReroll' : 'photo'}" data-arg="${st.id}">${avatar(st, 'md')}</button>
        <input class="inp" value="${esc(st.name)}" data-change="rename" data-arg="${st.id}" maxlength="30">
        <button class="x" data-act="delst" data-arg="${st.id}" aria-label="Verwijderen">✕</button></div>`).join('') || '<p class="muted">Nog geen leerlingen in deze klas.</p>'}</div>`;
}
function nameFromFile(fn) {
  const n = fn.replace(/\.[^.]+$/, '').replace(/[_\-]+/g, ' ').replace(/\s+/g, ' ').trim();
  return n ? n.charAt(0).toUpperCase() + n.slice(1) : 'Leerling';
}
function findStudent(id) { for (const c of D.classes) { const s = c.students.find(x => x.id === id); if (s) return {c, s}; } return null; }

/* ===================== Acties ===================== */
const ACT = {
  wNext: () => { if (G && G.running && G.after) { const f = G.after; G.after = null; f(); } },
  gnNext: () => { if (G && G.running && G.locked && G.gq) gnAfter(G.gq); },
  duo: () => { DUO.sel = DUO.sel.filter(p => p.guest || (curClass() && curClass().students.some(s => s.id === p.id))); showDuoPick(); },
  duoTog: id => { const i = DUO.sel.findIndex(p => p.id === id); if (i >= 0) DUO.sel.splice(i, 1); else { if (DUO.sel.length >= 3) { toast('Maximaal 3 spelers.'); return; } const st = curClass().students.find(s => s.id === id); if (st) DUO.sel.push(st); } showDuoPick(); },
  duoRandom: n => {
    const c = curClass(); if (!c) { toast('Kies eerst een klas.'); return; }
    n = +n; if (c.students.length < n) { toast('Te weinig leerlingen in deze klas.'); return; }
    let pool = c.students.filter(s => !DUO.played.has(s.id));
    if (pool.length < n) { DUO.played.clear(); pool = c.students.slice(); toast('Iedereen heeft gespeeld, we beginnen opnieuw.'); }
    DUO.sel = shuffle(pool.slice()).slice(0, n);
    const tiles = [...document.querySelectorAll('.pgrid .ptile:not(.guest)')]; let k = 0;
    const spin = setInterval(() => { tiles.forEach(t => t.classList.remove('spin')); const t = tiles[rnd(0, tiles.length - 1)]; if (t) t.classList.add('spin'); if (++k > 9) { clearInterval(spin); showDuoPick(); beep(true); toast('⚔ ' + DUO.sel.map(p => p.name).join(' vs ')); } }, 90);
  },
  duoGuest: () => { if (DUO.sel.length >= 3) { toast('Maximaal 3 spelers.'); return; } DUO.sel.push({id: 'gast' + Date.now(), name: 'Gast ' + (DUO.sel.filter(p => p.guest).length + 1), guest: true}); showDuoPick(); },
  duoStart: () => { if (DUO.sel.length >= 2) { GID = DUO.game && screen === 'duores' ? DUO.game : GID; duoStart(); } },
  duoPickAgain: () => { GID = DUO.game || GID; showDuoPick(); },
  duoQuit: async () => { if (await ask('Stoppen met dit potje?', 'Stoppen', 'Doorgaan')) { duoStop(); showDuoPick(); } },
  zoom: v => { D.zoom = +v; save(); applyZoom(); showSettings(); },
  home: () => { stopGame(); duoStop(); const gr = GRADE || gradeOf(GID); if (gr && screen !== 'settings' && screen !== 'stats' && screen !== 'student') showGrade(gr); else showHome(); },
  grades: () => showHome(),
  grade: v => showGrade(+v),
  settings: () => showSettings(),
  stats: () => {
    const c = curClass();
    if (c && !A.some(r => r[1] === c.id && STAT_TOPICS[ST.topic].g.includes(r[3]))) {
      const k = Object.keys(STAT_TOPICS).find(k => A.some(r => r[1] === c.id && STAT_TOPICS[k].g.includes(r[3]))); if (k) ST.topic = k;
    }
    showStats();
  },
  period: v => { ST.period = v; if (rerender) rerender(); },
  stStudent: id => { ST.student = id; showStudent(); },
  clsLevel: v => { const c = curClass(); if (!c) return; c.level = +v; save(); showSettings(); },
  clsLevelStats: v => { const c = curClass(); if (!c) return; c.level = +v; save(); toast(`Klasniveau van ${c.name} is nu ${LEVELS[c.level - 1].name}.`); showStats(); },
  csvOverview: () => csvOverview(),
  csvAll: () => csvAll(),
  topic: k => { ST.topic = k; if (rerender) rerender(); },
  setup: () => showSetup(),
  fullscreen: () => { const d = document; if (d.fullscreenElement) d.exitFullscreen && d.exitFullscreen(); else (d.documentElement.requestFullscreen || d.documentElement.webkitRequestFullscreen || (() => {})).call(d.documentElement); },
  openGame: id => { if (GAMES[id]) { GID = id; showSetup(); } },
  tog: arg => {
    const i = arg.indexOf(':'), k = arg.slice(0, i), v = arg.slice(i + 1), arr = cfg()[k].slice(), j = arr.indexOf(v);
    if (arr.length === OPTDEFS[k].choices.length) { setCfg(k, [v]); showSetup(); toast('Alleen dit onderdeel gekozen. Tik andere aan om ze toe te voegen.'); return; }
    if (j >= 0) { if (arr.length > 1) arr.splice(j, 1); else { toast('Er moet minstens één onderdeel aan staan.'); return; } } else arr.push(v);
    setCfg(k, arr); showSetup();
  },
  all: k => { setCfg(k, OPTDEFS[k].choices.map(ch => ch.v)); showSetup(); },
  opt: arg => { const i = arg.indexOf(':'), k = arg.slice(0, i), v = arg.slice(i + 1); const ch = choicesFor(GID, k).find(x => String(x.v) === v); if (ch) setCfg(k, ch.v); showSetup(); },
  toPlayers: () => { if (screen === 'results' && G) GID = G.game; stopGame(); showPlayers(); },
  board: () => { BM.on = false; showBoard(); },
  bmOff: () => { BM.on = false; showBoard(); },
  delScore: async arg => {
    const [t, sid] = arg.split('|'), f = findStudent(sid);
    if (!await ask(`Deze score van ${f ? f.s.name : 'deze leerling'} wissen?`, 'Wissen')) return;
    D.scores = D.scores.filter(x => !(String(x.t) === t && x.s === sid)); save(); toast('Score gewist.'); showBoard();
  },
  cls: id => { D.lastClass = id; save(); if (rerender) rerender(); },
  pick: id => { const c = curClass(); const st = c && c.students.find(s => s.id === id); if (!st) return; if (avMode() === 'karakter' && !st.avChosen) showAvPick(st, c.id); else startGame(st, c.id); },
  avPick: seed => { const f = findStudent(AVP.sid); if (!f) return; f.s.av = +seed; f.s.avChosen = true; save(); startGame(f.s, f.c.id); },
  avMore: () => { AVP.seeds = AVP.seeds.map(() => Math.floor(Math.random() * 1e9)); showAvPick(); },
  avSkip: () => { const f = findStudent(AVP.sid); if (!f) return; f.s.avChosen = true; save(); startGame(f.s, f.c.id); },
  avStyle: async v => { if (v === avStyle()) return; D.avStyle = v; save(); showSettings(); if (D.classes.some(c => c.students.some(x => x.avChosen)) && await ask('Nieuwe stijl gekozen. Mogen alle leerlingen bij hun volgende potje opnieuw een karakter kiezen?', 'Ja, opnieuw kiezen', 'Nee')) { D.classes.forEach(c => c.students.forEach(x => x.avChosen = false)); save(); toast('Bij het volgende potje kiezen ze opnieuw.'); } },
  avMode: v => { D.avMode = v; save(); if (v === 'pixel') ensurePix(); showSettings(); },
  avReroll: id => { const f = findStudent(id); if (!f) return; f.s.av = Math.floor(Math.random() * 1e9); f.s.avChosen = true; save(); showSettings(); },
  avResetAll: async () => { const c = curClass(); if (!c || !await ask(`Alle leerlingen van ${c.name} kiezen bij hun volgende potje opnieuw een karakter. Doorgaan?`, 'Ja')) return; c.students.forEach(x => x.avChosen = false); save(); toast('Bij het volgende potje kiezen ze opnieuw.'); },
  delPhotos: async () => { const c = curClass(); if (!c || !await ask(`De echte foto's van ${c.name} van dit apparaat wissen? De karakters en scores blijven.`, 'Wissen')) return; c.students.forEach(x => { x.photo = null; x.pix = null; }); save(); showSettings(); toast("Foto's gewist."); },
  guest: () => startGame({id: 'guest', name: 'Gast', guest: true}, null),
  again: () => { GID = G.game; startGame(G.player, G.classId); },
  quit: async () => { if (await ask('Stoppen met dit spel? De score wordt niet bewaard.', 'Stoppen', 'Doorgaan')) { stopGame(); saveAns(); showSetup(); } },
  addClass: () => {
    const v = $('#newcls').value.trim(); if (!v) { toast('Typ eerst een naam voor de klas.'); return; }
    const k = {id: uid(), name: v, students: []}; D.classes.push(k); D.lastClass = k.id; save(); showSettings();
  },
  delClass: async id => {
    const c = getClass(id); if (!c) return;
    if (!await ask(`Klas ${c.name} met alle leerlingen en scores verwijderen?`, 'Verwijderen')) return;
    D.classes = D.classes.filter(x => x.id !== id); D.scores = D.scores.filter(s => s.c !== id); A = A.filter(r => r[1] !== id); saveAns(); D.lastClass = null; save(); showSettings();
  },
  importPdf: () => startImport(),
  impToggle: i => { const it = IMP.items[+i]; it.on = !it.on; impApplyFmt(); showImport(); },
  impFmt: f => { IMP.fmt = f; IMP.items.forEach(it => it.edited = false); impApplyFmt(); showImport(); },
  impPaste: async () => {
    const t = await askText('Plak de namen, één per regel, in dezelfde volgorde als de foto\'s.', 'Emma de Vries\nDaan Jansen\n…');
    if (t == null) return;
    const names = t.split(/\r?\n/).map(x => x.trim()).filter(Boolean); let k = 0;
    for (const it of IMP.items) { if (!it.on) continue; if (k >= names.length) break; it.raw = names[k++]; it.edited = false; }
    impApplyFmt(); showImport(); toast(`${k} namen ingevuld.`);
  },
  impCancel: () => { IMP = null; showSettings(); },
  impDo: () => {
    const c = getClass(IMP.classId); if (!c) return;
    let n = 0;
    IMP.items.forEach(it => { if (!it.on) return; n++; c.students.push({id: uid(), name: it.name.trim() || 'Leerling ' + n, photo: it.photo}); });
    IMP = null; if (save()) toast(`${n} leerlingen toegevoegd aan ${c.name}.`, 3500); showSettings();
  },
  addPhotos: async () => {
    const c = curClass(); if (!c) return;
    const files = await pickFiles('image/*', true); if (!files.length) return;
    toast(`Foto's verwerken… (${files.length})`, 10000);
    let n = 0;
    for (const f of files) { try { const photo = await fileToThumb(f); c.students.push({id: uid(), name: nameFromFile(f.name), photo}); n++; } catch (e) {} }
    save(); showSettings(); toast(`${n} leerling${n === 1 ? '' : 'en'} toegevoegd.`);
  },
  addNoPhoto: () => {
    const c = curClass(); if (!c) return;
    const st = {id: uid(), name: 'Nieuwe leerling', photo: null}; c.students.push(st); save(); showSettings();
    const inp = document.querySelector(`input[data-arg="${st.id}"]`); if (inp) { inp.focus(); inp.select(); }
  },
  photo: async id => {
    const f = findStudent(id); if (!f) return;
    const [file] = await pickFiles('image/*', false); if (!file) return;
    try { f.s.photo = await fileToThumb(file); save(); showSettings(); } catch (e) { toast('Deze foto kon niet worden geopend.'); }
  },
  delst: async id => {
    const f = findStudent(id); if (!f) return;
    if (!await ask(`${f.s.name} verwijderen (inclusief scores)?`, 'Verwijderen')) return;
    f.c.students = f.c.students.filter(s => s.id !== id); D.scores = D.scores.filter(s => s.s !== id); A = A.filter(r => r[2] !== id); saveAns(); save(); showSettings();
  },
  clearScores: async () => {
    const c = curClass(); if (!c) return;
    if (!await ask(`Alle scores en resultaten van ${c.name} wissen? Maak eventueel eerst een back-up.`, 'Wissen')) return;
    D.scores = D.scores.filter(s => s.c !== c.id); A = A.filter(r => r[1] !== c.id); saveAns(); save(); toast('Scores en resultaten gewist.');
  },
  sound: () => { D.sound = !D.sound; save(); showSettings(); },
  exportB: () => {
    downloadBlob(`lesspellen-backup-${today()}.json`, new Blob([JSON.stringify(Object.assign({}, D, {answers: A}))], {type: 'application/json'}));
    toast('Back-up opgeslagen (meestal in de map Downloads).', 4000);
  },
  importB: async () => {
    const [f] = await pickFiles('.json,application/json', false); if (!f) return;
    try {
      const p = JSON.parse(await f.text());
      if (!p || !Array.isArray(p.classes) || !Array.isArray(p.scores)) throw 0;
      if (!await ask('Back-up terugzetten? De huidige klassen en scores op dit apparaat worden vervangen.', 'Terugzetten')) return;
      A = Array.isArray(p.answers) ? p.answers : []; saveAns();
      D = migrate(p); save(); showSettings(); toast('Back-up teruggezet.');
    } catch (e) { toast('Dit bestand is geen geldige back-up.'); }
  }
};
const CHANGE = {
  rename: (id, el) => { const f = findStudent(id); if (!f) return; const v = el.value.trim(); if (v) { f.s.name = v; save(); } else el.value = f.s.name; },
  renameClass: (id, el) => { const c = getClass(id); if (!c) return; const v = el.value.trim(); if (v) { c.name = v; save(); showSettings(); } else el.value = c.name; },
  impName: (i, el) => { const it = IMP && IMP.items[+i]; if (it) { it.name = el.value; it.edited = true; } }
};

app.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && !b.disabled && ACT[b.dataset.act]) ACT[b.dataset.act](b.dataset.arg, b, e); });
app.addEventListener('pointerdown', e => {
  const tg = e.target.closest('svg.tapgraph');
  if (tg) { e.preventDefault(); grTap(tg, e); return; }
  const bal = e.target.closest('.balloon');
  if (bal) { e.preventDefault(); balHit(bal); return; }
  const b = e.target.closest('[data-fast]'); if (!b) return; e.preventDefault();
  const f = b.dataset.fast;
  if (f === 'ans') rrAnswer(parseInt(b.dataset.arg, 10), b);
  else if (f === 'key') rrKey(b.dataset.arg);
  else if (f === 'bmove') blMove(b.dataset.arg);
  else if (f === 'bundo') blUndo();
  else if (f === 'gans') grAnswer(b.dataset.arg);
  else if (f === 'vop') vrOp(b.dataset.arg);
  else if (f === 'dans') duoAnswer(b.dataset.arg);
  else if (f === 'gkey') gnKey(b.dataset.arg);
  else if (f === 'wb') wbAnswer(b.dataset.arg);
  else if (f === 'wseg') weSeg(b.dataset.arg);
  else if (f === 'wkind') weKind(b.dataset.arg);
  else if (f === 'gpick') gnPick(b.dataset.arg);
  else if (f === 'gsel') gnSel(b.dataset.arg);
  else if (f === 'vans') vrAns(b.dataset.arg);
});
app.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el && CHANGE[el.dataset.change]) CHANGE[el.dataset.change](el.dataset.arg, el); });
app.addEventListener('input', e => { if (e.target.dataset.change === 'impName') CHANGE.impName(e.target.dataset.arg, e.target); });
app.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'newcls') ACT.addClass(); });
document.addEventListener('keydown', e => {
  if (screen === 'play' && G && G.running && G.game === 'gonio') {
    if (/^[0-9]$/.test(e.key)) gnKey(e.key);
    else if (e.key === ',' || e.key === '.') gnKey(',');
    else if (e.key === 'Backspace') gnKey('del');
    else if (e.key === 'Enter') { if (G.locked) ACT.gnNext(); else gnKey('ok'); }
    return;
  }
  if (screen !== 'play' || !G || !G.running || G.game !== 'rekenrace') return;
  if (G.cfg.input === 'typ') {
    if (/^[0-9]$/.test(e.key)) rrKey(e.key);
    else if (e.key === '-') rrKey('neg');
    else if (e.key === 'Backspace') rrKey('del');
    else if (e.key === 'Enter') rrKey('ok');
  } else if (/^[1-4]$/.test(e.key)) {
    const b = document.querySelectorAll('.ans')[+e.key - 1]; if (b) rrAnswer(parseInt(b.dataset.arg, 10), b);
  }
});
document.addEventListener('contextmenu', e => { if (!e.target.closest('input,textarea')) e.preventDefault(); });

function zoomLv() { return D.zoom || 0.85; }
function applyZoom() { document.documentElement.style.setProperty('--zoom', zoomLv()); }
applyZoom();
showHome();
</script>
