<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lesspellen</title>
<style>
:root{
  --bg:#F5F1E8;--card:#FFFFFF;--ink:#1C2333;--muted:#6A6F7C;--line:#E4DDCF;--soft:#EDE7DA;
  --add:#22955F;--sub:#2C6BD3;--mul:#E07020;--div:#8A4BD0;
  --good:#22955F;--bad:#D33F3F;--gold:#E8B10B;
  --sh:0 .12rem 0 rgba(28,35,51,.07),0 .7rem 1.6rem -.7rem rgba(28,35,51,.22);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{--zoom:.85;font-size:calc(var(--zoom) * clamp(14px,1.15vmin + .5vw,30px))}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI","Nunito",Roboto,system-ui,-apple-system,sans-serif;overscroll-behavior:none}
body{user-select:none;-webkit-user-select:none;touch-action:manipulation}
input,textarea{user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
#app{position:fixed;inset:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:1.1rem 1.6rem 1.3rem;gap:1rem;animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateY(.4rem)}}
.top{display:flex;align-items:center;gap:1rem;min-height:3rem;flex-wrap:wrap}
.top h1,.top h2,.top h3{margin:0;font-weight:800;letter-spacing:-.02em}
.top h1{font-size:2.3rem}.top h2{font-size:1.7rem}
.spacer{flex:1}
.muted{color:var(--muted)}.small{font-size:.8rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:3rem;padding:.55rem 1.25rem;
  border-radius:.9rem;background:var(--card);box-shadow:var(--sh);font-weight:700;font-size:1.02rem;transition:transform .08s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--ink);color:#fff}
.btn.big{min-height:4.4rem;font-size:1.55rem;padding:.8rem 2.4rem;border-radius:1.25rem}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.4}
.chip{padding:.35rem .9rem;border-radius:2rem;background:var(--soft);font-weight:700;font-size:.85rem;color:var(--muted)}
.card{background:var(--card);border-radius:1.4rem;box-shadow:var(--sh);padding:1.2rem 1.4rem}
.card h3{margin:0 0 .8rem;font-size:1.2rem}
.row{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;margin:.7rem 0}
.row.between{justify-content:space-between}
.grow{flex:1}
.inp{font:inherit;font-size:1rem;padding:.6rem .9rem;border-radius:.8rem;border:2px solid var(--line);background:#fff;min-height:3rem;min-width:0;color:var(--ink)}
.inp:focus{outline:none;border-color:var(--sub)}
textarea.inp{width:100%;min-height:12rem;resize:vertical}
.tabs,.chips{display:flex;gap:.5rem;flex-wrap:wrap}
.tab{padding:.6rem 1.1rem;border-radius:.8rem;background:var(--card);box-shadow:var(--sh);font-weight:700;font-size:1rem;min-height:2.8rem}
.tab.on{background:var(--ink);color:#fff}
.tab small{opacity:.6;margin-left:.3rem}
.empty{color:var(--muted);text-align:center;padding:2rem 1rem;font-size:1.1rem}

/* avatars */
.av{width:3rem;height:3rem;border-radius:.8rem;object-fit:cover;display:inline-grid;place-items:center;flex:none;
  color:#fff;font-weight:800;font-size:1.1rem;background:var(--soft)}
.av.sm{width:2.4rem;height:2.4rem;border-radius:.65rem;font-size:.9rem}
.av.md{width:4.2rem;height:4.2rem;border-radius:1rem;font-size:1.5rem}
.av.lg{width:100%;height:auto;aspect-ratio:1;border-radius:1.1rem;font-size:2.2rem}
.av{overflow:hidden}
.av.char svg{width:100%;height:100%;display:block}
.avstyles button{flex-direction:row;gap:.6rem}
.av.pix{image-rendering:pixelated}
.avgrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(9rem,1fr));gap:1rem;align-content:start;padding:.3rem}
.avgrid .ptile{padding:.6rem}
.av.xl{width:7rem;height:7rem;border-radius:1.6rem;font-size:2.8rem}

/* home */
.hint{font-size:.8rem;color:var(--muted);text-align:center;margin-top:.25rem}
.gear{position:relative;overflow:hidden;width:3.4rem;height:3.4rem;border-radius:1rem;background:var(--card);box-shadow:var(--sh);font-size:1.6rem}
.gear::after{content:"";position:absolute;inset:0;background:var(--ink);opacity:.18;transform:scaleY(0);transform-origin:bottom;transition:transform .15s}
.gear.pressing::after{transform:scaleY(1);transition:transform 1.5s linear}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:1.4rem;align-content:start;flex:1;overflow:auto;padding:.3rem}
.tile{background:var(--card);border-radius:1.6rem;box-shadow:var(--sh);padding:1.4rem;text-align:left;display:flex;flex-direction:column;gap:.9rem;transition:transform .1s}
.tile:active{transform:scale(.98)}
.tile .sym{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;height:4.6rem}
.tile .sym span{border-radius:1rem;display:grid;place-items:center;color:#fff;font-size:2.3rem;font-weight:800}
.tile .sky-mini{height:4.6rem;border-radius:1rem;background:linear-gradient(#D7E8FA,#F1F7FD);position:relative;overflow:hidden}
.tile .sky-mini i{position:absolute;width:2.6rem;height:3.1rem;border-radius:50% 50% 47% 47%/56% 56% 44% 44%;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:800;font-size:1rem}
.tile h3{margin:0;font-size:1.6rem}
.tile p{margin:0;color:var(--muted)}
.tile.soon{background:transparent;box-shadow:none;border:3px dashed var(--line);justify-content:center;align-items:center;color:var(--muted);min-height:14rem;cursor:default}
.add{background:var(--add)}.sub{background:var(--sub)}.mul{background:var(--mul)}.div{background:var(--div)}
.notice{background:#FFF6D6;border-radius:1rem;padding:.8rem 1.1rem;font-size:.95rem}
.warn{background:#FDE7E7;color:#8A1F1F;border-radius:1rem;padding:.8rem 1.1rem}

/* setup */
.setup{flex:1;overflow:auto;display:flex;flex-direction:column;gap:1rem}
.opt{display:grid;grid-template-columns:9rem 1fr;align-items:center;gap:1rem}
.opt>label{font-weight:800;font-size:1.15rem}
.seg{display:flex;gap:.6rem;flex-wrap:wrap}
.seg button{min-height:3.6rem;padding:.4rem 1.3rem;border-radius:1rem;background:var(--card);box-shadow:var(--sh);font-weight:700;font-size:1.15rem;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.seg button small{font-weight:600;font-size:.75rem;opacity:.7}
.seg button.on{background:var(--ink);color:#fff}
.seg button.opb{min-width:5.2rem;font-size:1.9rem}
.seg button.opb small{font-size:.7rem}
.seg button.opb.on.add{background:var(--add)}.seg button.opb.on.sub{background:var(--sub)}
.seg button.opb.on.mul{background:var(--mul)}.seg button.opb.on.div{background:var(--div)}
.example{font-size:1.1rem;color:var(--muted)}
.example b{color:var(--ink);font-size:1.4rem;font-variant-numeric:tabular-nums}
.actions{display:flex;gap:1rem;justify-content:flex-end;align-items:center;flex-wrap:wrap}

/* players */
.pgrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(7rem,1fr));gap:1rem;align-content:start;padding:.3rem}
.ptile{position:relative;background:var(--card);border-radius:1.3rem;box-shadow:var(--sh);padding:.7rem .7rem .6rem;display:flex;flex-direction:column;align-items:center;gap:.45rem;transition:transform .08s,opacity .15s}
.ptile:active{transform:scale(.95)}
.ptile .nm{font-weight:800;font-size:1rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptile .best{position:absolute;top:.35rem;right:.35rem;background:var(--gold);color:#3a2b00;border-radius:2rem;padding:.1rem .5rem;font-size:.75rem;font-weight:800}
.ptile.guest .av{background:var(--soft);color:var(--muted)}

/* play: shared */
.playbar{display:flex;align-items:center;gap:1.1rem}
.iconbtn{width:3.2rem;height:3.2rem;border-radius:1rem;background:var(--card);box-shadow:var(--sh);font-size:1.4rem;font-weight:800;flex:none}
.who{display:flex;align-items:center;gap:.6rem;font-weight:800;font-size:1.2rem;max-width:22%;white-space:nowrap;overflow:hidden}
.timer{flex:1;height:1.4rem;background:var(--soft);border-radius:1rem;overflow:hidden}
.timerfill{height:100%;width:100%;background:var(--ink);border-radius:1rem}
.timer.low .timerfill{background:var(--bad)}
.ttext{font-weight:800;font-size:1.5rem;font-variant-numeric:tabular-nums;min-width:3.2rem;text-align:right}
.scorebox{display:flex;align-items:baseline;gap:.4rem;background:var(--card);box-shadow:var(--sh);border-radius:1rem;padding:.3rem 1rem}
.scorebox b{font-size:2rem;font-variant-numeric:tabular-nums}
.scorebox{position:relative}
.ptpop{position:absolute;right:.6rem;top:100%;font-family:var(--fd);font-weight:900;font-size:1.4rem;opacity:0;pointer-events:none;white-space:nowrap;z-index:5}
.ptpop.up{color:var(--good)}.ptpop.down{color:var(--bad)}
.ptpop.go{animation:ptpop 1s ease forwards}
@keyframes ptpop{0%{opacity:0;transform:translateY(-.4rem)}15%{opacity:1;transform:translateY(.2rem)}80%{opacity:1}100%{opacity:0;transform:translateY(1.2rem)}}
.streak{font-family:var(--fd);font-style:italic;font-size:1.2rem;color:var(--mul);white-space:nowrap;min-width:0}
.streak.hot{color:var(--gold);text-shadow:0 0 1rem rgba(255,190,0,.7);animation:blink .45s infinite alternate}
.statrow{display:flex;gap:1.2rem;flex-wrap:wrap;justify-content:center;color:var(--muted);font-size:1rem}
.statrow b{color:var(--ink);font-family:var(--fd)}
.board .delsc{min-height:2.4rem;padding:.2rem .8rem;font-size:.9rem}
.qwrap{flex:1;display:grid;place-items:center;min-height:0}
.qcard{background:var(--card);border-radius:2rem;box-shadow:var(--sh);padding:1.5rem 3rem;min-width:62%;text-align:center;border:.35rem solid transparent;transition:background .15s,border-color .15s}
.qcard.good{border-color:var(--good);background:#EAF7F0}
.qcard.bad{border-color:var(--bad);background:#FCEDED}
.qtext{font-size:clamp(3rem,13vmin,10rem);font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
.slot{display:inline-block;min-width:1.4ch;color:var(--sub);border-bottom:.08em solid var(--line);padding:0 .1em}
.slot.reveal{color:var(--bad)}
.count{position:fixed;inset:0;display:grid;place-items:center;font-size:30vmin;font-weight:800;color:var(--ink);background:rgba(245,241,232,.85);z-index:20}
.count span{animation:pop .9s ease forwards}
@keyframes pop{from{transform:scale(1.4);opacity:0}30%{transform:scale(1);opacity:1}to{opacity:.2}}

/* rekenrace */
.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;height:27vh}
.ans{background:var(--card);border-radius:1.5rem;box-shadow:var(--sh);font-size:clamp(2.4rem,9vmin,7rem);font-weight:800;font-variant-numeric:tabular-nums;border-bottom:.35rem solid var(--line);transition:transform .06s}
.ans:active{transform:scale(.96)}
.ans.right{background:var(--good);color:#fff;border-color:#17704A}
.ans.wrong{background:var(--bad);color:#fff;border-color:#9E2A2A}
.keypad{display:grid;grid-template-columns:repeat(6,1fr) 1.6fr;grid-template-rows:1fr 1fr;gap:.8rem;height:30vh}
.key{background:var(--card);border-radius:1.2rem;box-shadow:var(--sh);font-size:clamp(2rem,7vmin,5rem);font-weight:800;border-bottom:.3rem solid var(--line)}
.key:active{transform:scale(.95)}
.key.neg{color:#fff;background:var(--sub);border-color:#1E4E9E}
.key.ok{grid-row:1 / span 2;grid-column:7;background:var(--ink);color:#fff;border-color:#000}
.key.del{color:var(--bad)}

/* ballonnen */
.bq{display:flex;justify-content:center}
.bq .qcard{min-width:50%;padding:.6rem 2.4rem}
.bq .qtext{font-size:clamp(2.6rem,10vmin,7rem)}
.sky{flex:1;position:relative;overflow:hidden;border-radius:1.6rem;background:linear-gradient(#D7E8FA,#F1F7FD 75%,#FBF6EA);box-shadow:inset 0 0 0 2px rgba(28,35,51,.05);touch-action:none}
.balloon{position:absolute;left:0;top:0;width:8rem;height:10rem;will-change:transform;touch-action:none}
.balloon .b{position:absolute;left:0;right:0;top:0;height:8.6rem;border-radius:50% 50% 47% 47%/56% 56% 44% 44%;
  background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.55) 0 10%,rgba(255,255,255,0) 11%),var(--c);
  box-shadow:inset -.6rem -.9rem 0 rgba(0,0,0,.13);display:grid;place-items:center;color:#fff;font-weight:800;font-size:2.7rem;
  text-shadow:0 .1rem .2rem rgba(0,0,0,.25);font-variant-numeric:tabular-nums}
.balloon .b.long{font-size:2.1rem}
.balloon .b::after{content:"";position:absolute;left:50%;bottom:-.5rem;transform:translateX(-50%);border-left:.45rem solid transparent;border-right:.45rem solid transparent;border-bottom:.6rem solid var(--c)}
.balloon::after{content:"";position:absolute;left:calc(50% - 1px);top:9rem;width:2px;height:1rem;background:rgba(28,35,51,.35)}
.balloon.pop .b{animation:popb .22s ease-out forwards}
.balloon.pop::after{display:none}
@keyframes popb{to{transform:scale(1.45);opacity:0}}
.balloon.nope .b{--c:#9AA0AA;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-.5rem)}50%{transform:translateX(.5rem)}75%{transform:translateX(-.3rem)}}
.spark{position:absolute;width:.7rem;height:.7rem;border-radius:50%;background:var(--c);animation:spark .5s ease-out forwards;pointer-events:none}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}

/* results */
.rgrid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:1.4rem;min-height:0}
.rgrid .card{overflow:auto}
.scorecard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.5rem}
.scorecard .pname{font-size:1.5rem;font-weight:800}
.bigscore{font-size:6rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.badge{background:var(--gold);color:#3a2b00;font-weight:800;padding:.4rem 1.1rem;border-radius:2rem;font-size:1.2rem;animation:pop2 .6s ease}
@keyframes pop2{from{transform:scale(.4)}60%{transform:scale(1.15)}}
.mist{width:100%;text-align:left;margin-top:.6rem}
.mist h4{margin:.3rem 0 .5rem;font-size:1rem;color:var(--muted)}
.mist div{font-size:1.25rem;font-weight:700;padding:.35rem .6rem;border-radius:.6rem;background:var(--soft);margin-bottom:.35rem;font-variant-numeric:tabular-nums}
.mist s{color:var(--bad);font-weight:600;margin-left:.6rem;font-size:1rem}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.45rem}
.board li{display:flex;align-items:center;gap:.8rem;padding:.4rem .7rem;border-radius:.9rem;background:var(--bg)}
.board li.me{background:#FFF0B8;outline:2px solid var(--gold)}
.board .rk{width:2.2rem;text-align:center;font-weight:800;font-size:1.2rem}
.board .nm{flex:1;font-weight:700;font-size:1.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .sc{font-weight:800;font-size:1.5rem;font-variant-numeric:tabular-nums}
.board .wr{color:var(--muted);font-size:.8rem;width:5.6rem;text-align:right;white-space:nowrap}

/* settings */
.sgrid{flex:1;display:grid;grid-template-columns:1fr 1.7fr;gap:1.4rem;min-height:0}
.sgrid>.col{display:flex;flex-direction:column;gap:1.4rem;overflow:auto}
.sgrid>.col2{overflow:auto}
.stgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:.7rem;margin-top:.8rem}
.stedit{display:flex;align-items:center;gap:.6rem;background:var(--bg);border-radius:1rem;padding:.5rem;transition:opacity .15s}
.stedit .inp{flex:1;min-height:2.6rem;padding:.4rem .6rem}
.stedit .x{width:2.4rem;height:2.4rem;border-radius:.7rem;color:var(--bad);font-weight:800;font-size:1.1rem;flex:none}
.stedit.off{opacity:.38}
.check{width:2.4rem;height:2.4rem;border-radius:.7rem;flex:none;border:2px solid var(--line);background:#fff;font-weight:800;color:#fff}
.check.on{background:var(--good);border-color:var(--good)}
.switch{width:4rem;height:2.2rem;border-radius:2rem;background:var(--line);position:relative;transition:background .2s}
.switch i{position:absolute;top:.25rem;left:.25rem;width:1.7rem;height:1.7rem;border-radius:50%;background:#fff;box-shadow:var(--sh);transition:left .2s}
.switch.on{background:var(--good)}.switch.on i{left:2.05rem}
.impwrap{flex:1;overflow:auto}

/* modal & toast */
.modal{position:fixed;inset:0;background:rgba(28,35,51,.45);display:grid;place-items:center;z-index:50;animation:in .15s}
.modal .card{max-width:34rem;width:90vw;text-align:center;padding:1.8rem}
.modal p{font-size:1.25rem;font-weight:700;margin:0 0 1.4rem}
.modal .row{justify-content:center}
#toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%) translateY(calc(100% + 3rem));background:var(--ink);color:#fff;
  padding:.8rem 1.4rem;border-radius:1rem;font-weight:700;z-index:60;transition:transform .25s;max-width:80vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
.confetti{position:fixed;top:-2rem;width:.8rem;height:1.2rem;z-index:40;border-radius:.2rem;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* startscherm secties */
.hs{flex:1;overflow:auto;padding:.3rem}
.grades{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(18rem,1fr));gap:1.6rem;align-content:center;padding:.3rem}
.gtile{position:relative;overflow:hidden;text-align:left;display:flex;flex-direction:column;gap:1rem;padding:1.8rem 1.8rem 1.6rem;min-height:22rem;border-radius:1.4rem;
  background:linear-gradient(160deg,color-mix(in srgb,var(--gc) 26%,transparent),rgba(255,255,255,.02) 60%),var(--card);border:2px solid color-mix(in srgb,var(--gc) 55%,transparent);box-shadow:var(--sh);transition:transform .1s}
.gtile:active{transform:scale(.98)}
.gtile .gnum{position:absolute;right:-.5rem;top:-2.4rem;font-family:var(--fd);font-style:italic;font-size:12rem;line-height:1;color:var(--gc);opacity:.22}
.gtile h3{margin:0;font-family:var(--fd);font-style:italic;text-transform:uppercase;font-size:2.6rem;color:#fff;text-shadow:0 .2rem 0 rgba(0,0,0,.4)}
.gch{display:flex;flex-direction:column;gap:.5rem;flex:1}
.gch span{font-weight:700;font-size:1.15rem;color:#DCE1F7;padding:.45rem .8rem;border-radius:.6rem;background:rgba(255,255,255,.06);border-left:.3rem solid var(--gc)}
.gcount{align-self:flex-end;font-family:var(--fd);font-style:italic;font-size:1rem;padding:.45rem 1rem;border-radius:.5rem;background:linear-gradient(var(--cta1),var(--cta2));color:var(--ctaInk);box-shadow:0 .2rem 0 var(--ctaD)}
.gtitle{color:var(--gc)!important;background:none!important;-webkit-text-fill-color:currentColor}
.sec.chap{display:flex;align-items:center;gap:.7rem}
.sec .chn{display:inline-grid;place-items:center;width:2.2rem;height:2.2rem;border-radius:.5rem;background:var(--gc);color:#0B1020;font-size:1.2rem;font-style:normal}
.hs .tiles{flex:none;overflow:visible;padding:0;margin-bottom:1.6rem}
.sec{margin:.2rem 0 .9rem;font-size:1.35rem;font-weight:800}
.sec span{font-size:.9rem;color:var(--muted);font-weight:700;margin-left:.4rem}
.mini-bal{height:4.6rem;display:flex;align-items:center;justify-content:center;gap:.35rem;background:var(--bg);border-radius:1rem}
.mini-bal{gap:.2rem}
.mini-bal b{font-size:1.8rem;margin:0 .4rem}
.mini-graf{height:4.6rem;display:flex;gap:.6rem;justify-content:center}
.mini-graf svg{height:100%;width:auto;border-radius:.6rem}

/* balansmethode */
.bwrap{flex:1;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:1.2rem;min-height:0}
.qcard.work{flex:1;width:100%;min-width:0;min-height:0;overflow:auto;display:flex;flex-direction:column;padding:1rem 1.6rem;text-align:left}
.work #hist{margin-top:.6rem}
.worktitle{font-family:var(--fd);font-style:italic;font-size:1.1rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:.4rem}
.work .heq{font-size:clamp(1.5rem,4vmin,2.8rem);gap:1.2rem;padding:.05rem 0}
.work .heq.hop{font-size:clamp(1.1rem,2.9vmin,2rem);padding-bottom:.4rem;margin-bottom:.3rem}
.work .heq.cur{font-size:clamp(2rem,6vmin,4.2rem);color:var(--ink)}
.work .heq:not(.cur):not(.hop){color:#C9CFEA}
.work .steps{text-align:center;margin:.5rem 0 0}
.side{display:flex;flex-direction:column;align-items:center;min-height:0;overflow:hidden;padding:1rem}
.side .scale{zoom:.8;width:100%;margin:auto 0}
.side .worktitle{align-self:flex-start}
.bmain{display:flex;flex-direction:column;align-items:center;justify-content:space-around;min-height:0;gap:.5rem}
.bqc{padding:.6rem 2.4rem;min-width:0}
.bqc .qtext{font-size:clamp(2.4rem,8vmin,5.6rem)}

.heq{display:grid;grid-template-columns:1fr auto 1fr;gap:.7rem;align-items:baseline;font-size:1.35rem;padding:.1rem .2rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.heq>span{text-align:center}
.heq.hop{font-size:1.2rem;color:var(--sub);padding-bottom:.55rem;margin-bottom:.35rem;border-bottom:2px solid var(--soft)}
.heq.hop.bad{color:var(--bad)}
.heq.cur{font-size:1.55rem}
.scale{position:relative;width:min(62rem,100%);height:15rem;flex:none;margin-bottom:2.2rem}
.pan{position:absolute;top:0;width:46%;height:10rem;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch}
.pan.l{left:0}.pan.r{right:0}
.tray{display:flex;flex-wrap:nowrap;justify-content:center;align-items:flex-end;gap:.5rem 1.4rem;width:100%;min-height:4rem;padding:.4rem .6rem;border-bottom:.6rem solid #8A90A0;border-radius:0 0 1.4rem 1.4rem}
.beam{position:absolute;left:6%;right:6%;top:10.3rem;height:.6rem;background:#5B6170;border-radius:1rem}
.post{position:absolute;left:50%;top:10.3rem;bottom:1rem;width:.8rem;transform:translateX(-50%);background:#5B6170}
.base{position:absolute;left:50%;bottom:0;width:11rem;height:1.2rem;transform:translateX(-50%);background:#5B6170;border-radius:.8rem .8rem .3rem .3rem}
.tk{min-width:3.2rem;height:3.4rem;padding:0 .6rem;border-radius:.8rem;display:inline-grid;place-items:center;font-weight:800;font-size:1.5rem;color:#fff;font-variant-numeric:tabular-nums}
.tk.x{background:var(--div);border-radius:1.4rem 1.4rem .7rem .7rem}
.tk.xn{background:#fff;color:var(--div);border:.2rem dashed var(--div);border-radius:1.4rem 1.4rem .7rem .7rem}
.tk.n{background:#4A5163;min-width:4rem;height:4rem}
.tk.nn{background:#fff;color:var(--bad);border:.2rem dashed var(--bad);min-width:4rem;height:4rem}
.tk.z{background:transparent;color:var(--muted)}
.fl{position:absolute;left:50%;top:0;font-size:2.4rem;font-weight:800;color:var(--sub);animation:flup 1s ease forwards;pointer-events:none;white-space:nowrap}
@keyframes flup{from{opacity:0;transform:translate(-50%,1rem)}20%{opacity:1}to{opacity:0;transform:translate(-50%,-2.5rem)}}
.bhint{font-size:1.15rem;font-weight:700;color:var(--muted);min-height:1.6rem;text-align:center}
.bhint.warn2{color:var(--bad)}
.moves{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;min-height:6rem;align-items:center}
.mv{min-width:9rem;height:6rem;padding:0 1.6rem;border-radius:1.4rem;background:var(--card);box-shadow:var(--sh);font-size:clamp(2rem,6vmin,3.4rem);font-weight:800;border-bottom:.35rem solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.mv:active{transform:scale(.95)}
.mv.undo{min-width:6rem;color:var(--muted)}
.mv:disabled{opacity:.3}
.solved{font-size:3rem;font-weight:800;color:var(--good);display:flex;align-items:baseline;gap:1.2rem}
.solved small{font-size:1.1rem;color:var(--muted)}

/* grafiek & formule */
.gqc{padding:.6rem 2rem;min-width:0}
.gqc .qtext{font-size:clamp(1.7rem,5vmin,3.4rem);white-space:normal}
.fx{white-space:nowrap;color:var(--sub)}
.garea{flex:1;min-height:0;display:grid;gap:1.2rem}
.garea.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.gopt{position:relative;background:var(--card);border-radius:1.4rem;box-shadow:var(--sh);padding:.8rem;display:grid;place-items:center;border:.35rem solid transparent;min-height:0;overflow:hidden}
.gopt svg{width:100%;height:100%;max-height:100%}
.gopt.right{border-color:var(--good);background:#EAF7F0}.gopt.wrong{border-color:var(--bad);background:#FCEDED}
.glab{position:absolute;top:.5rem;left:.8rem;font-weight:800;font-size:1.4rem;color:var(--muted)}
.garea.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.gbig{display:grid;place-items:center;min-height:0;padding:.6rem;overflow:hidden}
.gbig svg{height:100%;width:100%}
.bigf{font-size:clamp(2.6rem,8vmin,6rem);font-weight:800;white-space:nowrap}
.gans{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1rem;min-height:0}
.gans .ans{font-size:clamp(2rem,7vmin,4.4rem)}
.gans .ans.small{font-size:clamp(1.3rem,3.6vmin,2.4rem);padding:0 .5rem}
.gexp{min-height:2rem;text-align:center;font-size:1.3rem;font-weight:600}

/* samen spelen */
.ptile.duosel{outline:.3rem solid var(--lc);box-shadow:0 0 1.6rem var(--lc)}
.pbadge{position:absolute;top:.35rem;left:.35rem;background:var(--lc);color:#0B1020;font-family:var(--fd);border-radius:.4rem;padding:.05rem .45rem;font-size:.9rem;z-index:2}
.ptile.spin{outline:.3rem solid var(--gold);transform:scale(1.04)}
.duosel-list{display:flex;gap:.5rem;flex-wrap:wrap}
.duo{flex:1;display:grid;gap:1rem;min-height:0}
.lane{position:relative;display:flex;flex-direction:column;gap:.6rem;min-height:0;min-width:0;padding:.8rem;border-radius:1rem;border:3px solid var(--lc);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.01)),var(--card);transition:background .15s}
.lane.good{background:linear-gradient(180deg,rgba(46,229,157,.2),rgba(46,229,157,.04)),var(--card)}
.lane.bad{background:linear-gradient(180deg,rgba(255,77,109,.22),rgba(255,77,109,.04)),var(--card)}
.lhead{display:flex;align-items:center;gap:.6rem}
.lname{font-family:var(--fd);font-style:italic;font-size:1.2rem;color:var(--lc);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lstreak{font-family:var(--fd);color:var(--mul);margin-left:auto}
.lpts{font-family:var(--fd);color:var(--muted);white-space:nowrap}.lpts b{font-size:1.8rem;color:var(--gold)}
.lq{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;text-align:center;overflow:hidden}
.dq{font-family:var(--fd);font-size:clamp(1.8rem,5vmin,3.6rem);white-space:nowrap;font-variant-numeric:tabular-nums}
.dq.small{font-size:clamp(1.4rem,3.6vmin,2.6rem)}
.dsub{font-size:1.05rem;font-weight:700;color:#C9CFEA}
.dsub .fx{color:var(--sub)}
.dfig{flex:1;min-height:0;width:100%;display:flex;justify-content:center}.dfig svg{height:100%;max-width:100%}
.lexp{min-height:1.4rem;font-size:.95rem;text-align:center;color:#C9CFEA}
.lopts{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;height:34%}
.lopts.big{height:52%}
.dans{font-size:clamp(1.3rem,3.6vmin,2.6rem);min-width:0;padding:.2rem;overflow:hidden}
.lopts.big .dans{background:#fff;padding:.2rem}.lopts.big .dans svg{height:100%;width:100%}
.dans .gtab{font-size:clamp(.9rem,2vmin,1.4rem)}
.lpop{position:absolute;right:1rem;top:3rem;font-family:var(--fd);font-size:1.6rem;animation:ptpop .9s ease forwards;pointer-events:none}
.lpop.up{color:var(--good)}.lpop.down{color:var(--bad)}
.podium{flex:1;display:flex;gap:1.4rem;justify-content:center;align-items:flex-end}
.pod{display:flex;flex-direction:column;align-items:center;gap:.4rem;border-top:.5rem solid var(--lc);min-width:18rem}
.pod.win{transform:scale(1.06);box-shadow:0 0 3rem var(--lc)}
.pmed{font-size:3rem}
.pod .pname{font-family:var(--fd);font-style:italic;text-transform:uppercase;font-size:1.5rem;color:var(--lc)}
/* resultaten */
.scroll{flex:1;overflow:auto;display:flex;flex-direction:column;gap:1.2rem;padding:.2rem .2rem 1rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:1rem}
.kpi{background:var(--card);border-radius:1.2rem;box-shadow:var(--sh);padding:.9rem 1.2rem;border-top:.45rem solid var(--c)}
.kpi .l{font-weight:700;color:var(--muted);font-size:.9rem}
.kpi .v{font-size:2.4rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .s{font-size:.8rem;color:var(--muted)}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:1.2rem}
.ebar{display:grid;grid-template-columns:minmax(10rem,15rem) 1fr 3.4rem;gap:.9rem;align-items:center;margin:.6rem 0}
.ebar small{display:block;color:var(--muted);font-size:.75rem;line-height:1.25}
.ebar .track{height:1.1rem;background:var(--soft);border-radius:1rem;overflow:hidden}
.ebar .fill{height:100%;background:var(--bad);border-radius:1rem;opacity:.85}
.ebar .cnt{text-align:right;font-weight:800;font-size:1.2rem;font-variant-numeric:tabular-nums}
.ebar .cnt small{font-weight:600}
.advice{border-left:.45rem solid var(--gold)}
.advice p{margin:.2rem 0 .8rem;font-size:1.05rem;line-height:1.4}
table.st{width:100%;border-collapse:separate;border-spacing:0 .35rem;font-size:1rem}
table.st th{text-align:left;font-size:.8rem;color:var(--muted);font-weight:700;padding:0 .6rem}
table.st td{background:var(--bg);padding:.4rem .6rem;font-variant-numeric:tabular-nums}
table.st td:first-child{border-radius:.8rem 0 0 .8rem}
table.st td:last-child{border-radius:0 .8rem .8rem 0}
table.st tbody tr{cursor:pointer}
table.st tbody tr:active td{background:var(--soft)}
.who2{display:flex;align-items:center;gap:.6rem}
.pc{display:inline-block;min-width:3.4rem;text-align:center;border-radius:.5rem;padding:.15rem .4rem;font-weight:800}
.pc.g{background:#DDF3E7;color:#17704A}.pc.y{background:#FFF1C2;color:#7A5A00}.pc.r{background:#FBDADA;color:#9E2A2A}.pc.n{color:var(--muted)}
.mlist div{display:flex;align-items:baseline;gap:.7rem;padding:.4rem .7rem;border-radius:.7rem;background:var(--bg);margin-bottom:.35rem}
.mlist .mq{font-weight:800;font-size:1.15rem;font-variant-numeric:tabular-nums}
.mlist s{color:var(--bad);font-weight:700}
.mlist .mt{margin-left:auto;font-size:.8rem;color:var(--muted);font-weight:700;white-space:nowrap}
.lvrow{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin:.7rem 0}
.lvrow .seg button{min-height:3rem;font-size:1rem;padding:.3rem 1rem}

:root{
  --bg:#0B1020;--card:#151C38;--ink:#F2F4FF;--muted:#8F98BF;--line:#2A3462;--soft:#1D2550;
  --add:#2EE59D;--sub:#3DA5FF;--mul:#FF9F1C;--div:#B26BFF;
  --good:#2EE59D;--bad:#FF4D6D;--gold:#FFD23F;
  --cta1:#FFE14D;--cta2:#FFB800;--ctaD:#A87400;--ctaInk:#1A1300;--dark:#08101F;
  --fd:"LS","Segoe UI Black","Arial Black",system-ui,sans-serif;
  --sh:0 .3rem 0 #070B1C,0 .8rem 1.6rem -.6rem rgba(0,0,0,.65);
}
body{background:radial-gradient(60rem 30rem at 12% -12%,rgba(61,165,255,.22),transparent 60%),radial-gradient(55rem 32rem at 112% 115%,rgba(178,107,255,.24),transparent 60%),linear-gradient(180deg,#0B1024,#0D1232)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:3rem 3rem;-webkit-mask-image:radial-gradient(ellipse at center,#000 25%,transparent 80%);mask-image:radial-gradient(ellipse at center,#000 25%,transparent 80%)}
/* koppen */
.top h1{font-family:var(--fd);font-style:italic;text-transform:uppercase;font-size:3.2rem;letter-spacing:.01em;line-height:1;padding-right:.2em;background:linear-gradient(180deg,#fff 15%,#FFD23F 55%,#FF8A00 95%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .28rem 0 rgba(0,0,0,.55))}
.top h2,.tile h3,.sec{font-family:var(--fd);font-style:italic;text-transform:uppercase;letter-spacing:.01em}
.top h2{font-size:1.9rem;text-shadow:0 .2rem 0 rgba(0,0,0,.5)}
.card h3{font-family:var(--fd);font-style:italic;letter-spacing:.01em}
.sec{font-size:1.5rem}
.sec span{font-family:inherit;font-style:normal;text-transform:none;font-size:.85rem;color:#8FD0FF;background:rgba(61,165,255,.15);border:1px solid rgba(61,165,255,.35);padding:.15rem .6rem;border-radius:.4rem;vertical-align:.2em}
/* panelen */
.card,.tile,.ptile,.kpi,.gopt,.qcard,.scorebox{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.015)),var(--card);border:1px solid rgba(255,255,255,.09);box-shadow:var(--sh)}
.card,.kpi{border-radius:1rem}
/* knoppen: blokkig en 3D */
.btn,.tab,.seg button,.iconbtn,.gear,.ans,.key,.mv{background:linear-gradient(180deg,#2A3566,#1B2350);border:1px solid rgba(255,255,255,.1);border-bottom:0;box-shadow:0 .32rem 0 #090D24,0 .7rem 1.2rem -.5rem rgba(0,0,0,.7);border-radius:.8rem;transition:transform .06s,box-shadow .06s}
.btn:active,.tab:active,.seg button:active,.iconbtn:active,.ans:active,.key:active,.mv:active{transform:translateY(.22rem);box-shadow:0 .1rem 0 #090D24}
.btn.primary,.tab.on,.seg button.on,.key.ok{background:linear-gradient(180deg,var(--cta1),var(--cta2));color:var(--ctaInk);box-shadow:0 .32rem 0 var(--ctaD),0 0 1.4rem rgba(255,190,0,.3);border-color:rgba(255,255,255,.35)}
.btn.big,.btn.primary,.tab,.seg button{font-family:var(--fd);font-style:italic;letter-spacing:.01em}
.btn.big{text-transform:uppercase;border-radius:1rem}
.btn.danger{color:#FF8FA3}
.seg button.multi{position:relative;padding-left:2.7rem}
.seg button.multi::before{content:"";position:absolute;left:.75rem;top:50%;transform:translateY(-50%);width:1.25rem;height:1.25rem;border-radius:.3rem;border:2px solid currentColor;opacity:.45;font-style:normal;font-size:.95rem;line-height:1.1rem;text-align:center}
.seg button.multi.on::before{content:"✓";opacity:1;background:rgba(0,0,0,.18);font-family:system-ui,sans-serif;font-weight:900}
.seg button.multi:not(.on){opacity:.85}
.optnote{display:block;font-size:.75rem;font-weight:600;color:var(--muted);font-family:system-ui,sans-serif}
.seg button small,.tab small{font-family:system-ui,sans-serif;font-style:normal}
.seg button.opb.on{color:var(--dark);box-shadow:0 .32rem 0 rgba(0,0,0,.45),0 0 1.2rem rgba(255,255,255,.12)}
.seg button.opb.on.add{background:linear-gradient(180deg,#6FF5C0,var(--add))}.seg button.opb.on.sub{background:linear-gradient(180deg,#86C8FF,var(--sub))}
.seg button.opb.on.mul{background:linear-gradient(180deg,#FFC066,var(--mul))}.seg button.opb.on.div{background:linear-gradient(180deg,#D3A8FF,var(--div))}
.chip{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:#C3CAEB}
.inp{background:#0E1430;border-color:var(--line);color:var(--ink)}
.inp:focus{border-color:var(--sub);box-shadow:0 0 0 3px rgba(61,165,255,.25)}
.notice{background:rgba(255,210,63,.1);border:1px solid rgba(255,210,63,.35);color:#FFE9A6}
.warn{background:rgba(255,77,109,.13);border:1px solid rgba(255,77,109,.4);color:#FFB3C1}
.gear::after{background:var(--gold);opacity:.35}
/* startscherm */
.tile{border-radius:1.1rem;padding-bottom:3.8rem;position:relative;overflow:hidden}
.tile::after{content:"SPEEL ▶";position:absolute;right:1.1rem;bottom:1.1rem;font-family:var(--fd);font-style:italic;font-size:.95rem;padding:.4rem .9rem;border-radius:.5rem;background:linear-gradient(var(--cta1),var(--cta2));color:var(--ctaInk);box-shadow:0 .2rem 0 var(--ctaD)}
.tile::before{content:"";position:absolute;left:0;top:0;right:0;height:.3rem;background:linear-gradient(90deg,var(--sub),var(--div))}
.tile:active{transform:scale(.98);box-shadow:0 0 0 2px var(--sub),0 0 2rem rgba(61,165,255,.4)}
.tile h3{font-size:1.9rem}
.tile h3.long{font-size:1.45rem}
.tile .sym span{color:var(--dark);font-family:var(--fd);border-radius:.6rem;box-shadow:inset .2rem .2rem 0 rgba(255,255,255,.3),inset -.2rem -.2rem 0 rgba(0,0,0,.25)}
.tile .sky-mini{background:linear-gradient(#0A1238,#2B1B58);border:1px solid rgba(255,255,255,.08)}
.tile .sky-mini i{font-family:var(--fd);font-style:normal}
.mini-bal{background:#0E1430;border:1px solid rgba(255,255,255,.06)}
/* spelers */
.ptile{border-radius:1rem}
.ptile .nm{font-family:var(--fd);font-style:italic}
.ptile .best{color:var(--ctaInk);font-family:var(--fd)}
.av{background:var(--soft)}
/* spelen */
.who{font-family:var(--fd);font-style:italic}
.timer{position:relative;height:1.7rem;background:#0E1430;border:1px solid rgba(255,255,255,.1);border-radius:.5rem}
.timer::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(5% - 3px),#0B1020 calc(5% - 3px) 5%)}
.timerfill{background:linear-gradient(90deg,var(--sub),var(--div));border-radius:0;box-shadow:0 0 1rem rgba(61,165,255,.6)}
.timer.low .timerfill{background:var(--bad);box-shadow:0 0 1.2rem rgba(255,77,109,.8);animation:blink .5s infinite alternate}
@keyframes blink{to{opacity:.55}}
.ttext{font-family:var(--fd)}
.scorebox b{font-family:var(--fd);font-style:italic;color:var(--gold);text-shadow:0 .15rem 0 rgba(0,0,0,.5)}
.qcard{border-radius:1.1rem;border:.3rem solid rgba(255,255,255,.08)}
.qcard.good{border-color:var(--good);background:linear-gradient(180deg,rgba(46,229,157,.22),rgba(46,229,157,.06)),var(--card);box-shadow:0 0 2rem rgba(46,229,157,.35)}
.qcard.bad{border-color:var(--bad);background:linear-gradient(180deg,rgba(255,77,109,.24),rgba(255,77,109,.06)),var(--card);box-shadow:0 0 2rem rgba(255,77,109,.35)}
.qtext,.ans,.key,.mv,.bigf,.tk,.balloon .b,.heq,.solved,.board .sc,.kpi .v,.bigscore,.mlist .mq{font-family:var(--fd);font-weight:900;letter-spacing:0}
.slot{color:var(--sub);border-bottom-color:var(--line);text-shadow:0 0 1.2rem rgba(61,165,255,.6)}
.slot.reveal{color:var(--bad);text-shadow:0 0 1.2rem rgba(255,77,109,.6)}
.count{background:rgba(5,8,20,.88)}
.count span{font-family:var(--fd);font-style:italic;background:linear-gradient(180deg,#fff 15%,var(--gold) 55%,#FF8A00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .8rem 0 rgba(0,0,0,.6));padding:0 .1em}
.ans.right{background:linear-gradient(180deg,#6FF5C0,var(--good));color:var(--dark);box-shadow:0 .32rem 0 #12865A,0 0 1.6rem rgba(46,229,157,.55)}
.ans.wrong{background:linear-gradient(180deg,#FF8095,var(--bad));color:#fff;box-shadow:0 .32rem 0 #A3203A,0 0 1.6rem rgba(255,77,109,.5)}
.key.neg{background:linear-gradient(180deg,#86C8FF,var(--sub));color:var(--dark);box-shadow:0 .32rem 0 #1D5FA3}
.key.del{color:#FF8FA3}
/* ballonnen: nachtlucht, som onderin */
.sky{border-radius:1.1rem;border:1px solid rgba(255,255,255,.08);background:
  radial-gradient(1.5px 1.5px at 12% 18%,rgba(255,255,255,.8),transparent),radial-gradient(1.5px 1.5px at 38% 62%,rgba(255,255,255,.6),transparent),
  radial-gradient(2px 2px at 71% 28%,rgba(255,255,255,.75),transparent),radial-gradient(1.5px 1.5px at 88% 74%,rgba(255,255,255,.55),transparent),
  radial-gradient(1.5px 1.5px at 55% 9%,rgba(255,255,255,.7),transparent);background-size:24rem 20rem;background-color:#0C1440;
  background-image:radial-gradient(1.5px 1.5px at 12% 18%,rgba(255,255,255,.8),transparent),radial-gradient(1.5px 1.5px at 38% 62%,rgba(255,255,255,.6),transparent),radial-gradient(2px 2px at 71% 28%,rgba(255,255,255,.75),transparent),radial-gradient(1.5px 1.5px at 88% 74%,rgba(255,255,255,.55),transparent),radial-gradient(1.5px 1.5px at 55% 9%,rgba(255,255,255,.7),transparent),linear-gradient(180deg,#0A1238,#1C1757 60%,#3A1E5C);
  background-repeat:repeat,repeat,repeat,repeat,repeat,no-repeat;background-size:24rem 20rem,24rem 20rem,24rem 20rem,24rem 20rem,24rem 20rem,100% 100%}
.bq.bottom .qcard{min-width:0;padding:.35rem 2.2rem}
.bq.bottom .qtext{font-size:clamp(2rem,6.2vmin,4.2rem)}
.balloon .b{box-shadow:inset -.6rem -.9rem 0 rgba(0,0,0,.2),0 0 0 .18rem rgba(255,255,255,.12);text-shadow:0 .12rem 0 rgba(0,0,0,.35)}
.balloon::after{background:rgba(255,255,255,.35)}
.balloon.nope .b{--c:#59607F}
/* uitslag */
.bigscore{font-style:italic;font-size:7rem;background:linear-gradient(180deg,#fff 15%,var(--gold) 60%,#FF8A00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .35rem 0 rgba(0,0,0,.55));padding:0 .12em}
.scorecard .pname{font-family:var(--fd);font-style:italic;text-transform:uppercase}
.badge{font-family:var(--fd);font-style:italic;text-transform:uppercase;background:linear-gradient(180deg,var(--cta1),var(--cta2));color:var(--ctaInk);border-radius:.5rem;box-shadow:0 .25rem 0 var(--ctaD),0 0 1.6rem rgba(255,190,0,.5)}
.board li{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.05);border-radius:.6rem}
.board li.me{background:rgba(255,210,63,.13);outline:2px solid var(--gold)}
.board .rk{font-family:var(--fd);font-style:italic;color:var(--muted)}
.board .sc{color:var(--gold)}
/* instellingen en overzicht */
.stedit{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.05)}
.check{background:#0E1430;border-color:var(--line)}
.modal{background:rgba(4,6,16,.72)}
#toast{background:#1D2650;border:1px solid rgba(255,255,255,.14);box-shadow:var(--sh)}
.pc.g{background:rgba(46,229,157,.16);color:#6FF5C0}.pc.y{background:rgba(255,210,63,.16);color:#FFE073}.pc.r{background:rgba(255,77,109,.18);color:#FF97AA}
table.st td{background:rgba(255,255,255,.04)}
.mlist div{background:rgba(255,255,255,.04)}
.mist div{background:rgba(255,255,255,.05)}
.kpi .v{font-style:italic}
.kpi{border-top:.45rem solid var(--c)}
.advice{border-left:.45rem solid var(--gold)}
/* balans: blokken */
.tray{border-bottom-color:#8C96C8}
.beam,.post,.base{background:linear-gradient(180deg,#7A84B8,#4E5788)}
.tk{border-radius:.3rem;box-shadow:inset .22rem .22rem 0 rgba(255,255,255,.25),inset -.22rem -.22rem 0 rgba(0,0,0,.35)}
.tk.x{background:#8E4BFF;border-radius:.3rem}
.tk.n{background:#5D6585}
.tk.xn{background:rgba(142,75,255,.12);color:#D2B4FF;border:.2rem dashed var(--div);border-radius:.3rem;box-shadow:none}
.tk.nn{background:rgba(255,77,109,.1);color:#FF97AA;border:.2rem dashed var(--bad);box-shadow:none}
.tk.z{box-shadow:none}
.tk.br{background:#1F8FA6;padding:0 .9rem;font-size:1.4rem}
.tk{display:inline-flex;align-items:center;justify-content:center;gap:.1em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;font-size:.58em;line-height:1.02;text-align:center;margin:0 .06em}
.fr>span:first-child{border-bottom:.09em solid currentColor;padding:0 .12em}
.mv.wide{font-size:clamp(1.5rem,4.2vmin,2.6rem);min-width:11rem}
.bhint b{color:var(--ink)}
.ups{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:0 2.2rem;padding:0 .6rem}
.wx,.wt,.bl{display:inline-flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:900;flex:none;font-variant-numeric:tabular-nums}
.wx{background:linear-gradient(#5A97FF,#2563EB);color:#fff;border-radius:.3rem;font-style:italic;box-shadow:inset .2rem .2rem 0 rgba(255,255,255,.28),inset -.2rem -.2rem 0 rgba(0,0,0,.3)}
.wx.d1{width:2.9rem;height:2.9rem;font-size:1.4rem}.wx.d5{min-width:3.6rem;height:3.4rem;padding:0 .4rem;font-size:1.4rem}.wx.d10{min-width:4.2rem;height:3.9rem;padding:0 .4rem;font-size:1.5rem}
.wt{position:relative;background:linear-gradient(#FFE066,#E5A800);color:#3A2B00;border-radius:.5rem .5rem .25rem .25rem;align-items:flex-end;padding-bottom:.25rem;box-shadow:inset .2rem .2rem 0 rgba(255,255,255,.35),inset -.2rem -.2rem 0 rgba(0,0,0,.22);margin-top:.6rem}
.wt::before{content:"";position:absolute;top:-.6rem;left:50%;transform:translateX(-50%);width:1rem;height:.75rem;border:.22rem solid #E5A800;border-bottom:0;border-radius:.6rem .6rem 0 0}
.wt.d1{width:2.3rem;height:2.2rem;font-size:1.05rem}.wt.d5{min-width:3rem;height:2.9rem;font-size:1.3rem;padding-left:.3rem;padding-right:.3rem}.wt.d10{width:3.6rem;height:3.5rem;font-size:1.5rem}
.bl{position:relative;margin:0 .05rem 1.5rem;border-radius:50% 50% 46% 46%/56% 56% 44% 44%;box-shadow:inset -.4rem -.5rem 0 rgba(0,0,0,.2)}
.bl::after{content:"";position:absolute;top:100%;left:calc(50% - 1px);width:2px;height:1.5rem;background:rgba(255,255,255,.5)}
.bl.bx{background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.55) 0 11%,transparent 12%),#3D7BFF;color:#fff;font-style:italic}
.bl.bn{background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.6) 0 11%,transparent 12%),#FFCE3C;color:#3A2B00}
.bl.d1{width:2.6rem;height:3.1rem;font-size:.95rem}.bl.d5{min-width:3.1rem;height:3.7rem;font-size:1.15rem;padding:0 .3rem}.bl.d10{width:3.6rem;height:4.3rem;font-size:1.3rem}
.env,.coin,.note,.debt{display:inline-flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:900;flex:none;font-variant-numeric:tabular-nums;position:relative}
.env{width:3rem;height:2.3rem;border-radius:.25rem;background:#2F6BF0;color:#fff;font-size:1.5rem;align-items:flex-end;padding-bottom:.1rem;overflow:hidden;box-shadow:inset 0 -.2rem 0 rgba(0,0,0,.25)}
.env::before{content:"";position:absolute;left:0;right:0;top:0;height:58%;background:rgba(0,0,0,.22);clip-path:polygon(0 0,100% 0,50% 100%)}
.env i{position:relative;font-style:italic}
.env.neg{background:#fff;color:#D92D4B;box-shadow:inset 0 0 0 .2rem #D92D4B}
.env.neg::before{background:rgba(217,45,75,.2)}
.coin{width:2.2rem;height:2.2rem;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE9A0,#E3AA00 70%);color:#5A3E00;font-size:.85rem;box-shadow:inset 0 0 0 .18rem #B88400}
.note{height:2.3rem;padding:0 .45rem;border-radius:.25rem;font-size:1.05rem;box-shadow:inset 0 0 0 .18rem rgba(0,0,0,.25)}
.note.d5{min-width:3rem;background:linear-gradient(#7EE2B0,#2FA36C);color:#08341F}
.note.d10{min-width:3.5rem;background:linear-gradient(#93BEFF,#3F7DDB);color:#0A2350}
.debt{height:2.3rem;padding:0 .45rem;border-radius:.2rem;background:#fff;color:#D92D4B;border:.2rem dashed #D92D4B;font-size:.95rem}
.debt.d1{min-width:2.6rem}.debt.d5{min-width:3rem}.debt.d10{min-width:3.6rem}
.legend .env{width:2.2rem;height:1.6rem;font-size:.8rem}.legend .note,.legend .debt{height:1.6rem;min-width:2.3rem;font-size:.7rem;padding:0 .3rem}
.mini-bal .env{width:2.5rem;height:1.9rem;font-size:.95rem}.mini-bal .coin{width:1.9rem;height:1.9rem;font-size:.65rem}.mini-bal .note,.mini-bal .debt{height:1.9rem;min-width:2.4rem;font-size:.75rem;padding:0 .3rem}
.tray .tgrp{flex-wrap:wrap-reverse;justify-content:center;flex:0 1 auto;min-width:0;gap:.3rem}
.legend{position:absolute;left:0;right:0;top:calc(100% + .4rem);justify-content:center;display:flex;align-items:center;gap:.45rem;font-size:.85rem;color:var(--muted)}
.legend .wt.d1{width:1.6rem;height:1.5rem;font-size:.75rem;margin:0 0 0 .2rem}.legend .wt::before{top:-.45rem;width:.7rem;height:.5rem;border-width:.16rem}
.legend .bl.d1{width:1.6rem;height:1.95rem;font-size:.65rem;margin:0 0 0 .8rem}.legend .bl::after{display:none}
.mini-bal .wx.d1,.mini-bal .wt.d1{transform:scale(.8)}.mini-bal .wt{margin-top:.4rem}
.vline{display:flex;align-items:baseline;gap:.8rem;font-family:var(--fd);font-size:clamp(1.6rem,4.4vmin,3rem);color:#C9CFEA;padding:.15rem 0;font-variant-numeric:tabular-nums;white-space:nowrap}
.vline.cur{font-size:clamp(2.2rem,6.5vmin,4.6rem);color:var(--ink)}
.veq{display:inline-block;width:1.1em;text-align:center;color:var(--muted)}
.vmark{text-decoration:underline;text-decoration-color:var(--sub);text-decoration-thickness:.12em;text-underline-offset:.15em}
.vsel{background:rgba(61,165,255,.22);outline:.12em solid var(--sub);border-radius:.25em;padding:0 .15em}
.vop{font:inherit;color:var(--gold);background:rgba(255,210,63,.12);border:2px solid rgba(255,210,63,.5);border-radius:.3em;padding:0 .22em;min-width:1.3em;line-height:1.05;box-shadow:0 .12em 0 rgba(0,0,0,.4)}
.vop:active{transform:translateY(.08em);box-shadow:none}
.vok{color:var(--good);margin-left:.4rem}
.vq{font-family:var(--fd);font-size:clamp(2rem,6vmin,3.4rem);align-self:center;margin-right:.6rem}
.vrules{display:flex;flex-direction:column;gap:.8rem;width:100%;margin:auto 0}
.vrule{display:flex;align-items:center;gap:.9rem;padding:.8rem 1rem;border-radius:.8rem;background:rgba(255,255,255,.04);border:2px solid transparent;font-size:1.15rem;color:var(--muted)}
.vrule b{font-family:var(--fd);font-size:1.6rem;width:1.6rem;text-align:center}
.vrule .vsym{font-family:var(--fd);font-size:1.8rem;min-width:3.2rem;text-align:center;color:var(--ink)}
.vrule.on{border-color:var(--gold);background:rgba(255,210,63,.1);color:var(--ink)}
.mini-vr{height:4.6rem;display:flex;flex-direction:column;justify-content:center;padding:0 1rem;background:#0E1430;border-radius:1rem;font-family:var(--fd);font-size:1rem;line-height:1.35}
.tgrp{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:.4rem}

.fl{font-family:var(--fd);color:var(--sub);text-shadow:0 0 1rem rgba(61,165,255,.7)}
.solved{text-shadow:0 0 1.4rem rgba(46,229,157,.5)}
/* grafiek */
.gopt.right{border-color:var(--good);background:linear-gradient(180deg,rgba(46,229,157,.2),rgba(46,229,157,.05)),var(--card)}
.gopt.wrong{border-color:var(--bad);background:linear-gradient(180deg,rgba(255,77,109,.2),rgba(255,77,109,.05)),var(--card)}
.glab{font-family:var(--fd);font-style:italic}
.graph text{font-family:system-ui,sans-serif}
svg.tapgraph{cursor:crosshair;touch-action:none}
.gtab{border-collapse:collapse;font-family:var(--fd);font-size:clamp(1.4rem,3.6vmin,2.4rem);background:#fff;color:#111}
.gtab th,.gtab td{border:2px solid #111;padding:.2rem .9rem;text-align:center;min-width:3.4rem}
.gtab th{background:#E9ECF2;font-style:italic}
.garea.grid2{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.garea .ans.pt{font-size:clamp(2rem,6vmin,4rem)}
.gside{display:flex;flex-direction:column;justify-content:center;gap:1rem;font-size:1.3rem}
.gside p{margin:0;line-height:1.4}
.found{font-family:var(--fd);font-size:2.6rem;color:var(--good)}
.found.empty{color:var(--muted)}
.gexp b,.qtext u{color:var(--ink)}
.mini-graf svg{border-radius:.4rem}

@media (max-aspect-ratio:1/1){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .two{grid-template-columns:1fr}
  .bwrap{grid-template-columns:1fr}.side{display:none}
  .garea.four{grid-template-columns:1fr 1fr}.garea.split{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
  .answers{grid-template-columns:1fr 1fr;height:34vh}
  .rgrid,.sgrid{grid-template-columns:1fr}
  .opt{grid-template-columns:1fr}
}
/* ===================== Goniometrie (klas 3 vwo) ===================== */
.gnwrap{flex:1;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:1.6rem;min-height:0}
.gnfig{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;min-height:0;padding:.8rem;overflow:hidden}
.gnfig svg{width:100%;flex:1;min-height:0;max-height:100%;border-radius:1rem}
.gnleg{display:flex;gap:1.8rem;flex-wrap:wrap;justify-content:center;font-weight:700;font-size:1.35rem}
.gnleg i{display:inline-block;width:1.5rem;height:.5rem;border-radius:.3rem;margin-right:.4rem;vertical-align:middle}
.gnside{display:flex;flex-direction:column;gap:1.1rem;min-height:0;justify-content:space-between}
.gnans{display:flex;align-items:baseline;justify-content:center;gap:.6rem;font-family:var(--fd);font-size:clamp(1.8rem,5vmin,3.2rem);padding:.4rem 1rem;line-height:1.1;flex:0 0 auto}
.gnlbl{color:var(--muted)}
.gnval{display:inline-block;min-width:3.2ch;text-align:center;color:var(--sub);border-bottom:.08em solid var(--line)}
.gnval.rv{color:var(--bad)}
.gnunit{font-size:.6em;color:var(--muted)}
.gnnote{padding:1.2rem 1.5rem;font-size:1.6rem;line-height:1.6;overflow:auto;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:safe center}
.gnnote .gnerr{font-weight:800;color:var(--gold);margin-bottom:.35rem}
.gnnote .gnl{margin:.15rem 0}
.gnnote .gnyou{color:var(--muted);margin-bottom:.3rem}
.gnnote .gnyou s{color:var(--bad)}
.gnnote .gnnx{margin-top:.8rem;min-height:3rem;align-self:flex-start;padding:.5rem 1.8rem;font-size:1.1rem}
.gnnote b.co{color:#5CA8FF}.gnnote b.ca{color:#2EE59D}.gnnote b.ch{color:#FFA23A}
.gnnote .fr{font-size:.85em}
.gnrule{font-weight:700}
.gnsos{display:flex;align-items:baseline;gap:.5rem}
.gnmn{display:inline-block;min-width:3.6rem;font-family:var(--fd);font-style:italic;letter-spacing:.05em;color:var(--gold);margin-right:.3rem}
.gncap{font-family:var(--fd);font-size:1.25em;line-height:1}
.gnrule small{display:block;color:#AEB6D8;font-weight:600;margin-top:.7rem;font-size:.8em}
.gnrule>div{margin:.15rem 0}
.gnsub{display:block;font-family:"Segoe UI","Nunito",Roboto,system-ui,sans-serif;font-size:.5em;font-weight:600;color:var(--muted);letter-spacing:0;text-transform:none;font-style:normal}
.gnpad{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:3.6rem;gap:.5rem;flex:0 0 auto;width:100%;max-width:30rem;align-self:center}
.gnpad .key{font-size:clamp(1.3rem,3.2vmin,2rem);border-radius:.8rem}
.gnpad .key.ok{grid-row:auto;grid-column:1 / -1;height:3.6rem}
.gnsum{color:var(--good);font-weight:800;margin-bottom:.7rem}
.gnnm{font-style:italic;font-family:"Times New Roman",Georgia,serif;font-weight:700;letter-spacing:.02em}
.gnpad.pick{grid-auto-rows:5.5rem;max-width:34rem}
.gnpad .key.big{font-size:clamp(1.8rem,4.6vmin,3rem)}
.gnpad.two{display:flex;flex-direction:column;gap:1rem;max-width:none}
.gnrow{display:flex;flex-direction:column;gap:.4rem}
.gnrow .gl{font-weight:800;color:#C9CFEA;font-size:1.45rem}
.gnrow .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(8rem,1fr));grid-auto-rows:4rem;gap:.5rem}
.gnpad .key.sm{font-size:clamp(1.15rem,2.6vmin,1.6rem);line-height:1.2;padding:.3rem .5rem}
.gnpad .key.sel{background:linear-gradient(180deg,var(--cta1),var(--cta2));color:var(--ctaInk)}
.gnpad .key.right{background:linear-gradient(180deg,#6FF5C0,var(--good));color:var(--dark)}
.gnpad .key.wrong{background:linear-gradient(180deg,#FF8095,var(--bad));color:#fff}
.mini-gon{height:4.6rem;display:flex;align-items:center;justify-content:center;background:#0E1430;border-radius:1rem}
.mini-gon svg{height:100%;width:auto}
/* havo 5 wiA */
.mini-w{height:4.6rem;display:flex;flex-direction:column;justify-content:center;gap:.3rem;padding:0 1rem;background:#0E1430;border-radius:1rem;font-size:.95rem;color:#C9CFEA}
.mini-w b{font-family:var(--fd);color:var(--good)}.mini-w b.bad{color:var(--bad)}
.qcard.wq{min-width:0;width:100%;text-align:left;padding:1.2rem 1.8rem}
.wlab{font-family:var(--fd);font-style:italic;text-transform:uppercase;font-size:1rem;color:var(--muted);letter-spacing:.04em;margin-bottom:.5rem}
.wdesc{font-size:clamp(1.5rem,3.6vmin,2.4rem);font-weight:700;line-height:1.45}
.weq{font-size:clamp(1.25rem,2.8vmin,1.8rem);font-weight:600;line-height:1.5}
.wa{padding:1.2rem 1.8rem}
.wea{font-size:clamp(1.35rem,3vmin,2rem);line-height:1.9}
.wseg{font:inherit;color:inherit;background:rgba(255,255,255,.06);border:2px dashed rgba(255,255,255,.22);border-radius:.6rem;padding:.1rem .5rem;margin:.15rem 0;text-align:left;cursor:pointer}
.wseg:not(:disabled):active{background:rgba(255,210,63,.18)}
.wseg.hit{background:rgba(255,210,63,.22);border:2px solid var(--gold)}
.wseg.bad{background:rgba(255,77,109,.18);border-color:var(--bad);text-decoration:line-through}
.wmissing{display:inline-block;padding:.1rem .6rem;border:2px dashed var(--gold);border-radius:.6rem;color:var(--gold);font-weight:700}
.wehint{font-size:1.3rem;font-weight:700;color:#C9CFEA;text-align:center;min-height:1.6rem}
.wopts{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;flex:0 0 auto}
.wopt{font-size:clamp(1.2rem,2.8vmin,1.9rem);min-height:4.6rem;padding:.4rem 1rem;line-height:1.2}
.wopt.wmiss{grid-column:1 / -1;max-width:30rem;justify-self:center;width:100%}
.wexp{font-size:1.3rem;line-height:1.55;text-align:left}
.wexp:empty{display:none}
.wexp .wgood{color:var(--good);font-family:var(--fd);font-size:1.5rem}.wexp .wbad{color:var(--bad);font-weight:700}
.wexp .wwhy{margin:.4rem 0}
.wfix{background:rgba(46,229,157,.1);border:1px solid rgba(46,229,157,.35);border-radius:.8rem;padding:.8rem 1.1rem;margin-top:.5rem}
.wfix.bad{background:rgba(255,77,109,.08);border-color:rgba(255,77,109,.35)}.wfix.bad span{color:#FF97AA}
.wfix span{display:block;font-family:var(--fd);font-style:italic;font-size:.9rem;color:var(--good);margin-bottom:.2rem}
.wnx{margin-top:.8rem;min-height:3rem;padding:.4rem 1.8rem}
.ddesc{font-size:1.25rem;line-height:1.5;text-align:left;color:#E3E7FA}
.lopts:has(.dans:not(:empty)) .dans{font-size:clamp(1rem,2.4vmin,1.5rem)}
.ddesc.small{font-size:1.1rem}.ddesc.ans{font-size:1.35rem;font-weight:700;background:rgba(255,255,255,.06);border-radius:.6rem;padding:.4rem .7rem}

<script>

/* ===================== Instellingen van de spellen ===================== */

  var: {label: 'Variabele', choices: [{v: 'x', name: 'x'}, {v: 'a', name: 'a'}, {v: 'p', name: 'p'}, {v: 't', name: 't'}, {v: 'mix', name: 'Wisselend'}]},
  qt: {label: 'Vragen', multi: true, allName: 'alle vraagsoorten', choices: [
    {v: 'kiesgraf', name: 'Grafiek kiezen', sub: 'bij een formule'}, {v: 'kiesform', name: 'Formule kiezen', sub: 'bij een grafiek'},

const BALLOON_COLORS = ['#FF4D6D', '#3DA5FF', '#21C98A', '#FF9F1C', '#9D5CFF', '#F54BC4', '#14B8D4'];

/* ===================== Opslag ===================== */
let storageOK = true;
try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); } catch (e) { storageOK = false; }

function defaultData() { return {version: 5, classes: [], scores: [], sound: true, lastClass: null, cfg: {}}; }
function migrate(p) {
  const d = Object.assign(defaultData(), p);

  if (p.rr && !d.cfg.rekenrace) d.cfg.rekenrace = p.rr;
  delete d.rr;
  for (const s of d.scores) if (s.m && s.g && !s.m.startsWith(s.g + '|')) s.m = s.g + '|' + s.m;
  if ((p.version || 1) < 3) for (const g in d.cfg) if (d.cfg[g]) d.cfg[g].level = 'klas';
  delete d.answers;
  const gq = d.cfg.grafiek && d.cfg.grafiek.qt;
  if ((p.version || 1) < 4 && Array.isArray(gq) && !gq.includes('tabel')) d.cfg.grafiek.qt = ['kiesgraf', 'kiesform', 'rico', 'snijy', 'tabel', 'puntop', 'rooster'];
  const bb = d.cfg.balans && d.cfg.balans.bt;
  if ((p.version || 1) < 5 && Array.isArray(bb)) d.cfg.balans.bt = bb.map(t => t === 't5' ? 't6' : t);

}
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return migrate(JSON.parse(raw)); } catch (e) {}
  return defaultData();
}
let D = load();
function save() {
  if (D.scores.length > 8000) D.scores = D.scores.slice(-8000);
  for (let i = 0; i < 3; i++) {
    try { localStorage.setItem(KEY, JSON.stringify(D)); return true; }
    catch (e) { if (A.length < 2000) break; A = A.slice(Math.floor(A.length / 2)); saveAns(); }
  }
  toast('Opslaan lukt niet (geheugen vol of geblokkeerd). Maak een back-up bij Instellingen.', 5000); return false;
}
/* Alle gegeven antwoorden: [tijd(s), klas, leerling, spel, som-soort, a, b, gegeven, ms, niveau] */
const AKEY = 'lesspellen_ans';
let A = [];
try { A = JSON.parse(localStorage.getItem(AKEY) || '[]') || []; } catch (e) { A = []; }
function saveAns() {
  if (A.length > 25000) A = A.slice(-25000);
  for (let i = 0; i < 4; i++) {
    try { localStorage.setItem(AKEY, JSON.stringify(A)); return true; }
    catch (e) { if (A.length < 200) break; A = A.slice(Math.floor(A.length / 4)); }
  }
  return false;
}

/* ===================== Hulpjes ===================== */
const $ = s => document.querySelector(s);
const app = $('#app');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

const fmt = n => n < 0 ? '−' + Math.abs(n) : String(n);
const fmtOp = n => fmt(n); // geen haakjes: −5 + −4
const byName = (a, b) => a.name.localeCompare(b.name, 'nl');
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const getClass = id => D.classes.find(c => c.id === id);
const curClass = () => getClass(D.lastClass) || D.classes[0] || null;
function initials(n) { const p = String(n).trim().split(/\s+/); return ((p[0] || '?')[0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase(); }
function colorFor(n) { const c = ['#2C6BD3', '#22955F', '#E07020', '#8A4BD0', '#C2416B', '#1F8A9A', '#B7791F']; let h = 0; for (const ch of String(n)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return c[h % c.length]; }
/* ---------- Karakters en pixel-foto's (in plaats van de echte foto) ---------- */
const avMode = () => D.avMode || 'karakter';
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (const ch of String(s)) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return h >>> 0; }
const seedOf = st => st.av != null ? st.av : hashStr(st.id || st.name);
const charCache = new Map();
const avStyle = () => D.avStyle || 'street';
function shade(hex, f) { const n = parseInt(hex.slice(1), 16); const c = [n >> 16, n >> 8 & 255, n & 255].map(v => Math.max(0, Math.min(255, Math.round(v + (f < 0 ? v * f : (255 - v) * f))))); return '#' + c.map(v => v.toString(16).padStart(2, '0')).join(''); }
function charSVG(seed, style = avStyle()) {
  const key = style + seed; if (charCache.has(key)) return charCache.get(key);
  const R = mulberry(seed), pick = a => a[Math.floor(R() * a.length)];
  const out = style === 'street' ? streetSVG(R, pick) : style === 'held' ? heroSVG(R, pick) : style === 'dier' ? animalSVG(R, pick) : style === 'pixel' ? pixelChar(seed) : style === 'monster' ? monsterSVG(R, pick) : style === 'robot' ? robotSVG(R, pick) : flatSVG(R, pick);
  charCache.set(key, out); return out;
}
const SVGW = inner => `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
const AV_BG = ['#1E3A8A', '#5B21B6', '#065F46', '#9A3412', '#831843', '#0F766E', '#334155', '#1D4ED8', '#7C2D12', '#4C1D95', '#155E75', '#3F6212'];
function flatSVG(R, pick) {
  const bg = pick(AV_BG);
  const skin = R() < 0.1 ? pick(['#9FE2BF', '#A5C8FF', '#CDB8FF']) : pick(['#FFDCB8', '#F6C79F', '#E8B48A', '#C68642', '#9C6338', '#6E4529', '#F2D3C0']);
  const skinD = shade(skin, -0.14);
  const hairC = pick(['#2B1B12', '#4A2E1C', '#8B4A2B', '#C9962E', '#E8D9B0', '#111111', '#B8410E', '#2563EB', '#DB2777', '#7C3AED', '#9CA3AF']);
  const shirt = pick(['#EF4444', '#F59E0B', '#10B981', '#3B82F6', '#8B5CF6', '#EC4899', '#F8FAFC', '#111827', '#14B8A6', '#F97316']);
  const gear = pick(['#EF4444', '#F59E0B', '#22C55E', '#3B82F6', '#A855F7', '#F8FAFC', '#111827', '#EC4899']);

  const ink = '#1F1A17';
  let back = '', front = '';

  const ears = hair === 'scarf' ? '' : `<circle cx="28" cy="47" r="5.5" fill="${skinD}"/><circle cx="72" cy="47" r="5.5" fill="${skinD}"/>`;
  const head = `<ellipse cx="50" cy="44" rx="${hair === 'scarf' ? 19 : 22}" ry="${hair === 'scarf' ? 22 : 25}" fill="${skin}"/>`;
  const top = `<path d="M27 43 C25 15 75 15 73 43 C69 31 58 27 50 27 C42 27 31 31 27 43 Z" fill="${hairC}"/>`;
  if (['short', 'long', 'bun', 'ponytail'].includes(hair)) front = top;
  if (hair === 'side') front = `<path d="M27 44 C24 14 76 14 73 40 C66 30 48 26 34 33 C31 36 29 40 27 44 Z" fill="${hairC}"/><path d="M34 33 C44 22 62 22 73 40 C62 30 48 30 34 33 Z" fill="${shade(hairC, 0.15)}"/>`;
  if (hair === 'bun') front += `<circle cx="50" cy="16" r="9" fill="${hairC}"/>`;
  if (hair === 'buzz') front = `<path d="M28 40 C28 20 72 20 72 40 C66 30 34 30 28 40 Z" fill="${hairC}" opacity=".85"/>`;
  if (hair === 'curly') front = [[31, 30], [40, 23], [51, 21], [62, 24], [70, 32], [27, 40], [73, 41]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="${8 + R() * 2}" fill="${hairC}"/>`).join('');
  if (hair === 'afro') front = `<path d="M26 42 C28 24 72 24 74 42 C66 34 34 34 26 42 Z" fill="${hairC}"/>`;
  if (hair === 'cap') front = `<path d="M26 38 C26 14 74 14 74 38 Z" fill="${gear}"/><path d="M48 34 L88 37 C88 42 60 43 48 40 Z" fill="${shade(gear, -0.2)}"/><circle cx="50" cy="17" r="3" fill="${shade(gear, -0.2)}"/>`;
  if (hair === 'beanie') front = `<path d="M25 41 C25 11 75 11 75 41 Z" fill="${gear}"/><rect x="24" y="34" width="52" height="9" rx="4" fill="${shade(gear, -0.18)}"/><circle cx="50" cy="11" r="6" fill="${shade(gear, 0.4)}"/>`;
  if (hair === 'scarf') front = `<path d="M27 38 C30 22 70 22 73 38 C64 30 36 30 27 38 Z" fill="${shade(gear, -0.12)}"/>`;
  const eyesT = pick(['dot', 'dot', 'dot', 'happy', 'wide']);
  let eyes = '';
  if (eyesT === 'dot') eyes = `<circle cx="41" cy="47" r="3.2" fill="${ink}"/><circle cx="59" cy="47" r="3.2" fill="${ink}"/>`;
  if (eyesT === 'happy') eyes = `<path d="M37 48 Q41 43 45 48" stroke="${ink}" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M55 48 Q59 43 63 48" stroke="${ink}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  if (eyesT === 'wide') eyes = `<circle cx="41" cy="47" r="5" fill="#fff"/><circle cx="59" cy="47" r="5" fill="#fff"/><circle cx="42" cy="48" r="2.6" fill="${ink}"/><circle cx="60" cy="48" r="2.6" fill="${ink}"/>`;
  const brows = R() < 0.6 ? `<path d="M36 40 L45 39" stroke="${shade(hairC, -0.2)}" stroke-width="2.4" stroke-linecap="round"/><path d="M55 39 L64 40" stroke="${shade(hairC, -0.2)}" stroke-width="2.4" stroke-linecap="round"/>` : '';
  const mouthT = pick(['smile', 'smile', 'open', 'grin', 'smirk']);
  let mouth = '';
  if (mouthT === 'smile') mouth = `<path d="M43 57 Q50 63 57 57" stroke="${ink}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;

  if (mouthT === 'smirk') mouth = `<path d="M44 58 Q52 61 58 55" stroke="${ink}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  const blush = R() < 0.5 ? `<circle cx="35" cy="54" r="4" fill="#F43F5E" opacity=".18"/><circle cx="65" cy="54" r="4" fill="#F43F5E" opacity=".18"/>` : '';
  let acc = '';
  const a = R();
  if (a < 0.2) acc = `<g fill="none" stroke="#111827" stroke-width="2.4"><circle cx="41" cy="47" r="7"/><circle cx="59" cy="47" r="7"/><path d="M48 47 L52 47"/></g>`;
  else if (a < 0.3) acc = `<rect x="32" y="42" width="15" height="9" rx="3" fill="#0B0B0B"/><rect x="53" y="42" width="15" height="9" rx="3" fill="#0B0B0B"/><path d="M47 45 L53 45" stroke="#0B0B0B" stroke-width="2"/>`;
  else if (a < 0.42 && !['scarf', 'beanie', 'cap'].includes(hair)) acc = `<path d="M24 46 C24 12 76 12 76 46" stroke="#374151" stroke-width="5" fill="none"/><rect x="18" y="40" width="10" height="16" rx="4" fill="${gear}"/><rect x="72" y="40" width="10" height="16" rx="4" fill="${gear}"/>`;
  else if (a < 0.52 && hair !== 'scarf') acc = `<circle cx="28" cy="54" r="2.2" fill="#FCD34D"/><circle cx="72" cy="54" r="2.2" fill="#FCD34D"/>`;
  return SVGW(`<rect width="100" height="100" fill="${bg}"/>${back}${shoulders}${neck}${ears}${head}${front}${blush}${brows}${eyes}${acc}${mouth}`);
}
function monsterSVG(R, pick) {
  const bg = pick(['#0F172A', '#1E1B4B', '#052E16', '#3B0764', '#172554', '#3F1D38', '#0C4A6E']);

      do { a = rnd(-R, R); b = rnd(-R, R); } while (!(a < 0 || b < 0) || ((a === 0 || b === 0) && Math.random() < 0.9));

      const R = L.mulR; let d, k;

    }

  } while (prev && q.text === prev.text && ++guard < 20);

}

  if (q.op === '×') spec = [q.a + q.b, c + q.a];

}

/* ===================== Scores ===================== */
function bestFor(sid, mk) { let m = null; for (const s of D.scores) if (s.s === sid && s.m === mk && (m === null || s.score > m)) m = s.score; return m; }
function bestList(classId, mk) {
  const cls = getClass(classId); if (!cls) return [];
  const best = new Map();
  for (const s of D.scores) {
    if (s.c !== classId || s.m !== mk) continue;
    const b = best.get(s.s);
    if (!b || s.score > b.score || (s.score === b.score && s.wrong < b.wrong)) best.set(s.s, s);
  }
  const out = [];
  for (const [sid, s] of best) { const st = cls.students.find(x => x.id === sid); if (st) out.push({st, score: s.score, wrong: s.wrong, good: s.good, t: s.t, sid}); }
  return out.sort((a, b) => b.score - a.score || a.wrong - b.wrong || a.t - b.t);
}

let IMP = null;
function splitName(raw) {

  if (raw.includes(',')) {
    const [last, rest] = raw.split(',', 2).map(x => x.trim());
    const rw = (rest || '').split(' ').filter(Boolean);
    const first = rw[0] || last; const tus = rw.slice(1).join(' ');
    return {first, full: [first, tus, rest ? last : ''].filter(Boolean).join(' ')};
  }
  return {first: raw.split(' ')[0], full: raw};
}
function impApplyFmt() {

  IMP.items.forEach((it, i) => {

    else if (cnt[f.first] > 1) { const rest = f.full.split(' ').slice(1); const last = rest.reverse().find(w => w[0] && w[0] === w[0].toUpperCase()) || rest[0]; it.name = f.first + (last ? ' ' + last[0] + '.' : ''); }

}
